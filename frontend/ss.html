<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Professional Two-Line Navbar | Elite Interface</title>
  <!-- Google Fonts: Inter for modern, crisp typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (free icons) for subtle professional icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;  /* soft neutral backdrop to emphasize navbar */
      min-height: 100vh;
    }

    /* demo spacer to showcase navbar alone - just to give context, no extra content interference */
    .hero-placeholder {
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .hero-placeholder p {
      color: #4a5b6e;
      font-size: 0.95rem;
      letter-spacing: -0.2px;
      border-left: 3px solid #2c7da0;
      padding-left: 1rem;
      background: #ffffffcc;
      backdrop-filter: blur(2px);
      width: fit-content;
      border-radius: 0 12px 12px 0;
    }

    /* ----- PROFESSIONAL TWO-LINE NAVBAR ----- */
    .navbar {
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02), 0 1px 0 #eef2f5;
      border-bottom: 1px solid #e9edf2;
      position: relative;
      width: 100%;
      z-index: 100;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* --- ROW 1: top line (brand + contact/cta) --- */
    .nav-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px 0;
      border-bottom: 1px solid #f0f2f5;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* logo / brand area */
    .logo {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1a3e50 0%, #2c7da0 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      transition: all 0.2s ease;
    }
    .logo span {
      background: linear-gradient(135deg, #2c7da0, #61a5c2);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-weight: 800;
    }

    /* top row right side: contact info + action button */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .contact-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c3e4e;
      background: #f8fafd;
      padding: 6px 14px;
      border-radius: 60px;
      transition: all 0.2s;
    }
    .contact-info i {
      font-size: 0.85rem;
      color: #2c7da0;
    }
    .contact-info span {
      font-weight: 500;
      letter-spacing: -0.2px;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #2c7da0;
      color: #2c7da0;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.2px;
    }
    .btn-outline i {
      font-size: 0.8rem;
    }
    .btn-outline:hover {
      background: #2c7da0;
      color: white;
      border-color: #2c7da0;
      box-shadow: 0 5px 12px rgba(44,125,160,0.2);
      transform: translateY(-1px);
    }

    /* --- ROW 2: main navigation line --- */
    .nav-row-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 0 12px 0;
      transition: all 0.2s;
    }
    .nav-menu {
      display: flex;
      list-style: none;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-menu li a {
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 8px 18px;
      color: #2c3e50;
      border-radius: 40px;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      letter-spacing: -0.2px;
      display: inline-block;
      background: transparent;
    }
    .nav-menu li a:hover {
      background: #eff6fa;
      color: #1f5e7a;
    }
    .nav-menu li a.active {
      background: #2c7da0;
      color: white;
      box-shadow: 0 4px 8px rgba(44,125,160,0.2);
      font-weight: 600;
    }
    /* hamburger (hidden on desktop) */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
      background: transparent;
      border: none;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .hamburger:hover {
      background: #f0f4f8;
    }
    .hamburger span {
      width: 26px;
      height: 2.5px;
      background: #2c3e50;
      border-radius: 4px;
      transition: 0.2s;
    }

    /* ----- RESPONSIVE: two-line nav transforms into hamburger + collapsible second row ----- */
    @media screen and (max-width: 820px) {
      .nav-container {
        padding: 0 20px;
      }
      /* hide top row right side (contact/btn) on medium-small screens? To keep two-line concept clean, we hide them on <= 768px */
      .top-actions {
        display: none;
      }
      /* hamburger appears */
      .hamburger {
        display: flex;
      }
      /* second row (nav links) becomes collapsible menu */
      .nav-row-bottom {
        display: none;
        width: 100%;
        padding: 0 0 20px 0;
        border-top: 1px solid #eef2f8;
        margin-top: 6px;
      }
      .nav-row-bottom.show {
        display: flex;
      }
      .nav-menu {
        flex-direction: column;
        width: 100%;
        gap: 6px;
      }
      .nav-menu li a {
        display: block;
        width: 100%;
        padding: 12px 16px;
        background: #fafcff;
        border-radius: 14px;
        font-size: 1rem;
      }
      .nav-menu li a:hover {
        background: #eef3fc;
        transform: translateX(4px);
      }
      .nav-menu li a.active {
        background: #2c7da0;
        color: white;
      }
      /* keep top row minimal but consistent */
      .nav-row-top {
        border-bottom: none;
        padding: 14px 0;
      }
      .logo {
        font-size: 1.5rem;
      }
    }

    /* tablet landscape (821px - 1024px) keep two-line full, but adjust spacing */
    @media screen and (min-width: 821px) and (max-width: 1024px) {
      .nav-container {
        padding: 0 28px;
      }
      .nav-menu li a {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      .contact-info span {
        font-size: 0.8rem;
      }
    }

    /* subtle hover animation for entire navbar elegance */
    .navbar {
      transition: box-shadow 0.2s;
    }
    .navbar:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    /* accessibility focus outline */
    .nav-menu li a:focus-visible, .btn-outline:focus-visible, .hamburger:focus-visible {
      outline: 2px solid #2c7da0;
      outline-offset: 2px;
      border-radius: 30px;
    }
  </style>
</head>
<body>

<nav class="navbar" aria-label="Main navigation with two-line professional structure">
  <div class="nav-container">
    <!-- FIRST LINE: Brand identity + professional contact / CTA -->
    <div class="nav-row-top">
      <div class="logo">
        Elevate<span>Core</span>
      </div>
      <div class="top-actions">
        <div class="contact-info">
          <i class="fas fa-phone-alt"></i>
          <span>+1 (888) 472-3690</span>
        </div>
        <a href="#" class="btn-outline" aria-label="Schedule consultation">
          <i class="fas fa-calendar-check"></i> Let’s talk
        </a>
      </div>
      <!-- Hamburger (mobile only) -->
      <button class="hamburger" id="mobileMenuBtn" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- SECOND LINE: Primary navigation menu (professional links) -->
    <div class="nav-row-bottom" id="primaryNavMenu">
      <ul class="nav-menu" role="list">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Solutions</a></li>
        <li><a href="#">Insights</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Company</a></li>
        <li><a href="#">Careers</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- subtle spacer to show navbar in context, without clutter (only for demonstration, navbar stands alone) -->
<div class="hero-placeholder">
  <p><i class="fas fa-bezier-curve" style="margin-right: 8px; color:#2c7da0;"></i> Dual‑line architecture · polished interaction · fully responsive</p>
</div>

<script>
  (function() {
    // Mobile menu toggle: preserve professional two-line behavior on mobile (collapsible second row)
    const hamburger = document.getElementById('mobileMenuBtn');
    const navMenuSecondRow = document.getElementById('primaryNavMenu');
    
    if (hamburger && navMenuSecondRow) {
      // toggle the second line (navigation links) when hamburger is clicked
      hamburger.addEventListener('click', function(e) {
        e.stopPropagation();
        const expanded = navMenuSecondRow.classList.contains('show');
        if (expanded) {
          navMenuSecondRow.classList.remove('show');
          hamburger.setAttribute('aria-expanded', 'false');
        } else {
          navMenuSecondRow.classList.add('show');
          hamburger.setAttribute('aria-expanded', 'true');
        }
      });
      
      // optional: close mobile menu if a nav link is clicked (improves UX)
      const navLinks = document.querySelectorAll('.nav-menu li a');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 820) {
            navMenuSecondRow.classList.remove('show');
            hamburger.setAttribute('aria-expanded', 'false');
          }
        });
      });
      
      // handle window resize: if resizing from mobile to desktop, ensure menu is visible and reset state
      window.addEventListener('resize', function() {
        if (window.innerWidth > 820) {
          // on desktop, ensure the second row is displayed (not hidden by .show override)
          navMenuSecondRow.classList.remove('show');
          navMenuSecondRow.style.display = 'flex';   // reset inline style, but we rely on CSS
          hamburger.setAttribute('aria-expanded', 'false');
          // Force display to match original flex behavior
          navMenuSecondRow.style.display = '';
        } else {
          // on mobile, if menu was open? keep as is, but also fix style display if any conflict
          if (!navMenuSecondRow.classList.contains('show')) {
            navMenuSecondRow.style.display = '';
          }
        }
        // ensure consistent state: remove any residual inline display styles
        if (window.innerWidth > 820) {
          navMenuSecondRow.style.display = '';
        }
      });
      
      // initial trigger: ensure on desktop second row visible (no extra inline)
      if (window.innerWidth > 820) {
        navMenuSecondRow.style.display = '';
      } else {
        // on mobile load, hide second row unless javascript toggled
        if (!navMenuSecondRow.classList.contains('show')) {
          navMenuSecondRow.style.display = '';   // css will handle hiding via media query
        }
      }
    }
    
    // active link update simulation (optional for demo: professional active state)
    // For demonstration, if user clicks any nav link we update active class (clean ux)
    const allLinks = document.querySelectorAll('.nav-menu li a');
    allLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        // remove active class from all
        allLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        // (just for demo, doesn't change URL)
      });
    });
  })();
</script>

<!-- additional micro-interaction to show refined two-line appearance: no extra elements, only professional navbar -->
</body>
</html>
